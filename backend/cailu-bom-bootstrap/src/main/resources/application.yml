server:
  port: 8080

spring:
  application:
    name: cailu-bom
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:cailu_bom}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # RabbitMQ: add spring-boot-starter-amqp + config when domain events are wired

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

cailu:
  jwt:
    # HS256 secret must be >= 32 bytes
    secret: ${CAILU_JWT_SECRET:cailu-bom-dev-secret-change-me-32b!!}
    expire-seconds: ${CAILU_JWT_EXPIRE_SECONDS:86400}

logging:
  level:
    com.cailu.bom: info
